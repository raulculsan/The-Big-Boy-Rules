<!doctype html><meta charset="utf-8"><title>El Chota · respiración dormido</title>
<link rel="stylesheet" href="../../../club.css"><link rel="stylesheet" href="../../../clubhouse.css">
<style>body{margin:0;background:#101216;color:#eee;font:16px system-ui;padding:24px}h1{font-size:20px}main{display:flex;align-items:flex-end;gap:40px}.sample{width:256px}.tigreton-sprite{width:256px;height:256px}.small{width:160px;height:160px}.large{width:360px;height:360px}.peak .chota-sleep-chest{transform:scaleY(1.12)}.live .chota-sleep-chest{animation:breath 4.4s infinite ease-in-out}.live .chota-sleep-tail{animation:tail 12s infinite ease-in-out}.live .chota-sleep-head{animation:head 19s infinite ease-in-out}@keyframes tail{0%,70%,100%{transform:rotate(0deg)}76%{transform:rotate(-5deg)}82%{transform:rotate(1.8deg)}88%{transform:rotate(-1.5deg)}}@keyframes head{0%,72%,100%{transform:translateY(0) rotate(0deg)}78%,84%{transform:translateY(.35%) rotate(-1.3deg)}92%{transform:translateY(0) rotate(.25deg)}}@keyframes breath{0%,92%,100%{transform:scaleY(1)}42%,50%{transform:scaleY(1.12)}}.tigreton-character{background-position:80% 100%}p{color:#b8bec7}.row{display:flex;align-items:flex-end;gap:32px}.room{position:relative;width:600px;height:600px;background:url('../../../icons/clubhouse/club-room-v1.webp') 0 0/100%}.room .tigreton-sprite{position:absolute;width:192px;height:192px;left:204px;top:315px}</style>
<style>main .sample:nth-child(3){display:none}.room{position:absolute;left:650px;top:90px;width:580px;height:580px}.room .tigreton-sprite{width:186px;height:186px;left:197px;top:304px}</style>
<h1>El Chota · respiración dormido</h1><main id="samples"></main><div class="room" id="room"></div>
<script>
const sprite='<span class="tigreton-sprite"><span class="tigreton-character is-sleep-breathing"><span class="chota-sleep-base"></span><span class="chota-sleep-tail"></span><span class="chota-sleep-chest"></span><span class="chota-sleep-head"></span><span class="chota-sleep-foreground"></span></span></span>';
document.querySelector('#samples').innerHTML=[['Espira','rest'],['Inspira','peak'],['Respiración continua','live']].map(([label,cls])=>`<div class="sample ${cls}"><p>${label}</p>${sprite}</div>`).join('');
document.querySelector('#room').innerHTML=`<div class="live">${sprite}</div>`;
</script>
