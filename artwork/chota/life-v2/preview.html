.clubhouse-sky-stars { position:absolute; inset:0; opacity:var(--club-sky-night,0); background:radial-gradient(circle .6px at 37.2% 23%,#d9e5ff 70%,transparent),radial-gradient(circle .8px at 72.1% 19.5%,#f3eddb 70%,transparent),radial-gradient(circle .5px at 52% 48.6%,#cbdcff 70%,transparent),radial-gradient(circle .7px at 74.3% 55%,#e8efff 70%,transparent),radial-gradient(circle .5px at 14.9% 53.8%,#f1e9d5 70%,transparent); transition:opacity 30s linear; }

.clubhouse-daylight > i { position:absolute; inset:0; display:block; background:url("icons/clubhouse/window-daylight-v1.svg") 0 0 / 100% 100% no-repeat; transform-origin:80% 60%; transform:scaleX(var(--club-sun-reach,1)); filter:saturate(var(--club-sun-saturation,1)); transition:transform 30s linear,filter 30s linear; }
:is(.clubhouse-room,.chota-viewer-room-scene).is-sleeping .clubhouse-daylight { opacity:0; transition-duration:3s; }

/* Midnight to 06:00: suppress the warm light painted into the illustration.
   The separate window sky stays visible, with a little cool ambient light. */
:is(.clubhouse-room, .chota-viewer-room-scene).is-sleeping :is(.clubhouse-art, .chota-viewer-room-art) { filter: brightness(.29) saturate(.28); }
:is(.clubhouse-room, .chota-viewer-room-scene)::before { content:""; position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity 3s ease-in-out; background:radial-gradient(ellipse 8% 6% at 41% 8%,#050a14d9,transparent 100%),radial-gradient(ellipse 8% 22% at 8% 43%,#050a14a6,transparent 100%),radial-gradient(ellipse 8% 12% at 6% 75%,#050a14c9,transparent 100%),radial-gradient(ellipse 7% 10% at 95% 72%,#050a14c9,transparent 100%),linear-gradient(100deg,#080f2533 0%,transparent 78%); }

.clubhouse-light-switch::before,.clubhouse-light-switch::after { content:""; position:absolute; left:43%; width:14%; height:4%; background:#574f42; }

.clubhouse-plan { position: absolute; z-index: 2; left: 19%; top: 23%; width: 32%; height: 19%; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; margin: 0; padding: 10px; border: 0; border-radius: 1px; background: #f1e0b5; color: #292621; text-align: left; font-family: inherit; transform: rotate(-2deg); cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

:is(.clubhouse-room,.chota-viewer-room-scene) .tigreton-agenda { position:absolute; z-index:3; inset:auto; left:var(--chota-home-left); top:var(--chota-home-top); width:var(--chota-home-width); height:var(--chota-home-width); min-height:0; display:block; pointer-events:none; }

.clubhouse-lamplight { position: absolute; z-index: 1; width: 14%; height: 9%; top: 5%; left: 34%; background: #ffd17b; opacity: 0; mix-blend-mode: soft-light; pointer-events: none; animation: clubhouse-light 6s ease-in-out infinite; animation-play-state: paused; }
.clubhouse-dust { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

.clubhouse-dust i:nth-child(2) { left: 56%; top: 60%; animation-delay: -4s; }
.clubhouse-dust i:nth-child(3) { left: 67%; top: 45%; animation-delay: -7s; }

.clubhouse-bunting i { width: 10%; height: 100%; background: #d6a252; clip-path: polygon(0 0, 100% 0, 50% 100%); }
.clubhouse-bunting i:nth-child(2n) { background: #945341; }
.clubhouse :is(button, a):focus-visible { outline: 2px solid #cecece; outline-offset: 3px; }
/* The expanded mascot stays inside the same room; its full square scene is never cropped. */
.chota-viewer { isolation: isolate; gap: 12px; background: #15191e; }
.chota-viewer::before { content: ""; position: fixed; inset: -28px; z-index: 0; background: url("icons/clubhouse/club-room-v1.webp") center / cover no-repeat; filter: blur(20px) brightness(.3); pointer-events: none; }
.chota-viewer > * { position: relative; z-index: 1; }

.chota-viewer-room-art { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; transition:filter 3s ease-in-out; }

}
@keyframes clubhouse-light { 0%, 100% { opacity: .02; } 45% { opacity: .1; } 55% { opacity: .06; } }

}
html[data-reduced-motion="true"] :is(.clubhouse-sky > i,.clubhouse-sky-stars,.clubhouse-daylight,.clubhouse-daylight > i) { transition:none; }

/* Quiet standing pose: separate head and torso preserve the feet's floor contact.
   These layers use cell zero of the existing sheet; commanded poses use the sheet normally. */
.chota-idle-paw, .chota-idle-body, .chota-idle-feet, .chota-idle-head, .chota-idle-tail, .chota-idle-ear { display:none; position:absolute; inset:0; background:url("icons/mascot/chota-v2/chota-idle-core-v2.svg") 0 0 / 100% 100% no-repeat; image-rendering:pixelated; pointer-events:none; }
.tigreton-character.is-idling { background-image:none; }
.tigreton-character.is-idling :is(.chota-idle-paw,.chota-idle-body,.chota-idle-feet,.chota-idle-head,.chota-idle-tail,.chota-idle-ear) { display:block; }
.chota-idle-paw { background-image:url("icons/mascot/chota-v2/chota-idle-paw-v2.svg"); transform-origin:40.6% 65%; }
.chota-idle-tail { background-image:url("icons/mascot/chota-v2/chota-idle-tail-v1.webp"); transform-origin:36% 72%; }
.chota-idle-ear--left { background-image:url("icons/mascot/chota-v2/chota-idle-ear-left-v1.webp"); transform-origin:45% 25%; }
.chota-idle-ear--right { background-image:url("icons/mascot/chota-v2/chota-idle-ear-right-v1.webp"); transform-origin:74% 30%; }
.chota-idle-body { clip-path:inset(52% 0 15%); transform-origin:50% 84%; }
/* Sneakers remain a stationary foreground layer during weight shifts/reflexes. */
.chota-idle-feet { clip-path:inset(83% 0 0); }
.chota-idle-head { clip-path:inset(0 0 46%); transform-origin:57% 52%; }
.chota-sleep-base,.chota-sleep-chest,.chota-sleep-head,.chota-sleep-tail,.chota-sleep-foreground { display:none; position:absolute; inset:0; background:url("icons/mascot/chota-v2/chota-poses.webp") 80% 100% / 600% 400% no-repeat; image-rendering:pixelated; pointer-events:none; }
.tigreton-character.is-sleep-breathing { background-image:none; }
.is-sleep-breathing :is(.chota-sleep-base,.chota-sleep-chest,.chota-sleep-head,.chota-sleep-tail,.chota-sleep-foreground) { display:block; }
.chota-sleep-base,.chota-sleep-foreground { -webkit-mask:url("icons/mascot/chota-v2/chota-sleep-base-mask.svg") 0 0 / 100% 100%; mask:url("icons/mascot/chota-v2/chota-sleep-base-mask.svg") 0 0 / 100% 100%; }
