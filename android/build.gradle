// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Keep generated files out of cloud-synced Documents. Its automatic numbered
// copies can become duplicate Android resources or classes during a build.
def generatedBuildRoot = new File(gradle.gradleUserHomeDir,
        "bigboy-generated/${Integer.toHexString(rootProject.projectDir.canonicalPath.hashCode())}")
allprojects {
    def moduleName = project.path == ':' ? 'root' : project.path.substring(1).replace(':', '-')
    layout.buildDirectory.set(new File(generatedBuildRoot, moduleName))
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete generatedBuildRoot
}
