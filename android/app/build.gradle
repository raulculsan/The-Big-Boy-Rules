apply plugin: 'com.android.application'

android {
    namespace = "com.raulculsan.thebigboyrules"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.raulculsan.thebigboyrules"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 7
        versionName "1.1.5"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            // Keep updates compatible with the certificate used by existing APKs.
            // This is a release build, not a debuggable build; migrate signing
            // deliberately before the store launch (see docs/android-hardening.md).
            signingConfig signingConfigs.debug
            debuggable false
            jniDebuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Cloud-synced checkouts can recreate numbered copies after Capacitor's sync
// hook has already cleaned them. Android resource names may not contain spaces.
def cleanNumberedAndroidResources = tasks.register('cleanNumberedAndroidResources') {
    doLast {
        fileTree('src/main/res').files.findAll { file ->
            file.name ==~ /.* [0-9]+\.[^.]+/
        }.each { file ->
            if (!file.delete()) throw new GradleException("Could not remove duplicate resource: ${file}")
        }
    }
}
def cleanNumberedAndroidAssets = tasks.register('cleanNumberedAndroidAssets') {
    doLast {
        fileTree('src/main/assets/public').files.each { file ->
            def copyName = file.name =~ /^(.*) [0-9]+(\.[^.]+)$/
            if (copyName.matches()) {
                def original = new File(file.parentFile, copyName.group(1) + copyName.group(2))
                if (original.isFile() && !file.delete()) {
                    throw new GradleException("Could not remove duplicate asset: ${file}")
                }
            }
        }
    }
}
tasks.configureEach { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('Resources')) {
        task.dependsOn(cleanNumberedAndroidResources)
    }
    if (task.name.startsWith('merge') && task.name.endsWith('Assets')) {
        task.dependsOn(cleanNumberedAndroidAssets)
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
